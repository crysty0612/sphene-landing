<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorizing Sphene Vault — Zero-Knowledge Cloud Relay</title>
  <link rel="icon" type="image/svg+xml" href="/assets/sphene-icon.svg">
  <link rel="alternate icon" type="image/png" href="/assets/icons/favicon.png">
  <meta name="theme-color" content="#0b0f19">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(16, 185, 129, 0.08) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .relay-card {
      position: relative;
      z-index: 1;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
    }
    .logo-badge img { width: 36px; height: 36px; }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      font-size: 0.82rem;
      font-weight: 600;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .destination-pill {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 6px;
    }
    .manual-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px 18px;
      background: #38bdf8;
      color: #090d16;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .manual-btn:hover { background: #7dd3fc; transform: translateY(-1px); }
    .security-note {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.72rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="relay-card">
    <div class="logo-badge">
      <img src="/assets/sphene-icon.svg" alt="Sphene">
    </div>
    <h2>Connecting Sphene Vault</h2>
    <p id="relay-desc">Authorizing zero-knowledge cloud sync with your personal account and returning to your vault...</p>
    <div class="spinner-wrap" id="spinner-wrap">
      <div class="spinner"></div>
      <span class="status-text" id="status-text">Relaying credentials...</span>
    </div>
    <div id="dest-container" style="display:none;">
      <div style="font-size:0.72rem; text-transform:uppercase; letter-spacing:0.5px; color:#64748b; margin-top:8px;">Target Instance:</div>
      <div class="destination-pill" id="dest-pill">--</div>
    </div>
    <div id="manual-action-container" style="display:none;">
      <a id="manual-return-link" href="#" class="manual-btn">
        <span>🚀 Click Here to Return to Sphene</span>
      </a>
    </div>
    <div class="security-note">
      <span>🛡️</span>
      <span>Zero-Knowledge: Tokens are never stored on this relay.</span>
    </div>
  </div>
  <script>
    (function() {
      const rawHash = window.location.hash ? window.location.hash.substring(1) : '';
      const rawSearch = window.location.search ? window.location.search.substring(1) : '';
      const params = new URLSearchParams(rawHash || rawSearch);

      const statusEl = document.getElementById('status-text');
      const descEl = document.getElementById('relay-desc');
      const destContainer = document.getElementById('dest-container');
      const destPill = document.getElementById('dest-pill');
      const manualCont = document.getElementById('manual-action-container');
      const manualLink = document.getElementById('manual-return-link');
      const spinnerWrap = document.getElementById('spinner-wrap');

      let returnUrl = params.get('state');

      const error = params.get('error') || params.get('error_description');
      if (error) {
        if (statusEl) { statusEl.textContent = 'Authorization Cancelled'; statusEl.style.color = '#f87171'; }
        if (descEl) { descEl.textContent = 'The cloud authorization request was cancelled or declined (' + error + ').'; }
        if (spinnerWrap) spinnerWrap.style.display = 'none';
        if (returnUrl) {
          if (destContainer) { destContainer.style.display = 'block'; destPill.textContent = returnUrl; }
          if (manualCont && manualLink) {
            manualCont.style.display = 'block';
            manualLink.href = returnUrl + (window.location.hash || window.location.search);
            manualLink.textContent = '↺ Return to Sphene Vault';
          }
        }
        return;
      }

      function isValidDestination(url) {
        if (!url || typeof url !== 'string') return false;
        try {
          const parsed = new URL(url);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch(e) { return false; }
      }

      if (returnUrl && isValidDestination(returnUrl)) {
        if (destContainer) { destContainer.style.display = 'block'; destPill.textContent = returnUrl; }
        const fullDestination = returnUrl + (window.location.hash || window.location.search);
        if (manualCont && manualLink) { manualLink.href = fullDestination; }
        setTimeout(() => {
          try { window.location.replace(fullDestination); }
          catch(e) { window.location.href = fullDestination; }
        }, 150);
        setTimeout(() => {
          if (manualCont) manualCont.style.display = 'block';
        }, 1200);
      } else {
        if (statusEl) { statusEl.textContent = 'Missing Return Vault Destination'; statusEl.style.color = '#fbbf24'; }
        if (descEl) { descEl.textContent = 'Credentials received, but no target Sphene vault return address was specified. Please return to your Sphene vault tab.'; }
        if (spinnerWrap) spinnerWrap.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
